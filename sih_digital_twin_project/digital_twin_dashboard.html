<div id="twin-root"></div>
<style>
  #twin-root, #twin-root * { box-sizing: border-box; }
  #twin-root {
    --bg: #0A0D10;
    --panel: #12171B;
    --panel-2: #161C21;
    --line: #232B31;
    --text: #DCE5EA;
    --text-dim: #7C8A93;
    --green: #34D399;
    --amber: #F2B84B;
    --red: #EF5A4C;
    --cyan: #5AC8F5;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
    background: var(--bg);
    color: var(--text);
    padding: 18px;
    border-radius: 10px;
    min-height: 620px;
  }
  #twin-root .hdr {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 14px;
    flex-wrap: wrap; gap: 10px;
  }
  #twin-root .hdr h1 {
    font-family: ui-sans-serif, "Inter", system-ui, sans-serif;
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-dim); font-weight: 600; margin: 0 0 4px 0;
  }
  #twin-root .hdr .unit {
    font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: 0.02em;
  }
  #twin-root .status-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 3px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid;
  }
  #twin-root .status-chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  #twin-root .status-healthy { color: var(--green); border-color: var(--green); background: rgba(52,211,153,0.08); }
  #twin-root .status-healthy .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  #twin-root .status-fault { color: var(--red); border-color: var(--red); background: rgba(239,90,76,0.08); }
  #twin-root .status-fault .dot { background: var(--red); box-shadow: 0 0 8px var(--red); animation: twin-pulse 1.4s infinite; }
  @keyframes twin-pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  #twin-root .grid {
    display: grid; grid-template-columns: 1fr 300px; gap: 14px;
  }
  #twin-root .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px;
  }
  #twin-root .panel-title {
    font-family: ui-sans-serif, "Inter", system-ui, sans-serif;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);
    margin: 0 0 10px 0; display: flex; justify-content: space-between; align-items: center;
  }
  #twin-root .legend-dot { width: 9px; height: 2px; display: inline-block; margin-right: 5px; vertical-align: middle; }
  #twin-root canvas { width: 100% !important; }
  #twin-root .side-stack { display: flex; flex-direction: column; gap: 14px; }
  #twin-root .readout { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  #twin-root .readout:last-child { border-bottom: none; }
  #twin-root .readout .label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  #twin-root .readout .val { font-weight: 700; font-size: 15px; }
  #twin-root .gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #twin-root .gauge-num { font-size: 26px; font-weight: 800; margin-top: -46px; }
  #twin-root .gauge-cap { font-size: 10px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }
  #twin-root .scrub-wrap { margin-top: 14px; padding: 12px 14px; }
  #twin-root input[type=range] { width: 100%; accent-color: var(--cyan); }
  #twin-root .scrub-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  #twin-root .footnote { font-family: ui-sans-serif, "Inter", system-ui, sans-serif; font-size: 11px; color: var(--text-dim); margin-top: 12px; line-height: 1.5; }
</style>
